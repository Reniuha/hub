<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GJS23 HUB</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="window">
      <div class="title-bar">
        <div class="title">💾 GJS23 HUB</div>

        <div class="window-buttons">
          <button>_</button>
          <button>□</button>
          <button>×</button>
        </div>
      </div>

      <div class="menu-bar">
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Help</span>
      </div>

      <main class="content">
        <div class="header">
          <h1>My Computer</h1>
          <p>GJS23 Student Projects</p>
        </div>

        <div class="projects">

        </div>
      </main>

      <div class="status-bar">
        <span class="project-count">Loading...</span>
        <span>HTML / CSS / JS</span>
      </div>
    </div>

    <div class="taskbar">
      <button class="start">🪟 Start</button>

      <div class="task">💾 GJS23 HUB</div>

      <div class="clock">23:47</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
